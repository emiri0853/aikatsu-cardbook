<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アンコール カード帳</title>
<meta name="theme-color" content="#FFF4FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="カード帳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="cards.js"></script>
<style>
:root{
  --bg:#FFF4FA; --bg2:#F1ECFF; --surface:#FFFFFF; --ink:#4A2357; --muted:#9A7BA6; --line:#F2DDEB;
  --pink:#FF5CA8; --pink-deep:#E83E8C; --pink-soft:#FFE1EF; --lav:#A98BFF; --lav-soft:#EEE7FF;
  --sky:#5CC2F2; --mint:#22B8A6; --mint-soft:#D6F6F1;
  --c-cute:#FF5CA8; --c-cool:#4C8BF5; --c-sexy:#9B5CF0; --c-pop:#FF9A3C;
  --r-er:linear-gradient(135deg,#FFC94D,#FF8FB8 55%,#B79BFF); --r-pr:#E2559E; --r-r:#5C9DF2; --r-n:#B29BBE;
  --shadow:0 6px 18px rgba(232,62,140,.12);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#22122A; --bg2:#1B1430; --surface:#32203D; --ink:#FBEFFF; --muted:#C3A6CF; --line:#4A3055;
  --pink-soft:#552443; --lav-soft:#3A2D5C; --mint-soft:#163F3A; --shadow:0 6px 18px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#22122A; --bg2:#1B1430; --surface:#32203D; --ink:#FBEFFF; --muted:#C3A6CF; --line:#4A3055;
  --pink-soft:#552443; --lav-soft:#3A2D5C; --mint-soft:#163F3A; --shadow:0 6px 18px rgba(0,0,0,.3);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;color:var(--ink);min-height:100%;
  background:
    radial-gradient(circle at 12% 8%, var(--pink-soft) 0 120px, transparent 121px),
    radial-gradient(circle at 92% 30%, var(--lav-soft) 0 160px, transparent 161px),
    linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding:12px 14px 10px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:860px;margin:0 auto}
h1{margin:0;font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif;font-weight:400;font-size:21px;line-height:1.15;letter-spacing:.02em;
  color:var(--pink-deep);text-shadow:2px 2px 0 var(--pink-soft)}
h1 small{display:block;font-size:11px;color:var(--lav);text-shadow:none;letter-spacing:.12em}
h1 .spark{color:#FFC94D;font-size:14px;vertical-align:top;margin-left:2px}
.brand-r{display:flex;align-items:center;gap:8px}
.progress{background:var(--surface);border-radius:999px;padding:5px 12px 6px;box-shadow:var(--shadow);font-size:12px;color:var(--muted);text-align:center;min-width:92px}
.progress b{color:var(--pink-deep);font-size:16px}
.bar{height:5px;border-radius:9px;background:var(--pink-soft);margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--lav));border-radius:9px;transition:width .4s}
.gear{background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;flex:none;color:var(--lav)}
.gear svg{width:21px;height:21px}
nav{display:flex;max-width:860px;margin:10px auto 0;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
nav button{flex:1;border:0;background:none;padding:8px 0;border-radius:999px;font-weight:800;font-size:14px;color:var(--muted);white-space:nowrap}
nav button[aria-selected="true"]{background:linear-gradient(135deg,var(--pink),#FF8FC4);color:#fff;box-shadow:0 3px 10px rgba(255,92,168,.35)}

main{max-width:860px;margin:0 auto;padding:6px 12px 40px}
.panel[hidden]{display:none}

/* search */
.search{display:flex;gap:8px;align-items:center}
.sbox{flex:1;min-width:0;position:relative}
.sbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--pink)}
.sbox input{width:100%;border:2px solid transparent;background:var(--surface);border-radius:999px;padding:10px 14px 10px 38px;box-shadow:var(--shadow);font-size:15px}
.sbox input:focus{border-color:var(--pink);outline:none}
.fbtn{flex:none;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;height:44px;padding:0 14px;font-weight:800;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:6px;position:relative}
.fbtn svg{width:17px;height:17px;color:var(--pink)}
.fbtn .badge[hidden]{display:none}
.fbtn .badge{background:var(--pink);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.active{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.active:empty{display:none}
.apill{border:0;background:var(--pink-soft);color:var(--pink-deep);border-radius:999px;padding:4px 8px 4px 12px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:4px}
.apill span{font-size:14px;line-height:1;opacity:.7}
.apill.clear{background:none;color:var(--muted);padding-left:6px}
.row-tools{display:flex;justify-content:space-between;align-items:center;margin:10px 4px 8px;font-size:13px;color:var(--muted);font-weight:700}

/* filter sheet */
.fsec{margin-top:14px}
.fsec h3{margin:0 0 6px;font-size:13px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:800;color:var(--ink)}
.opt small{color:var(--muted);font-weight:700;margin-left:3px}
.opt[aria-pressed="true"]{border-color:var(--pink);background:var(--pink-soft);color:var(--pink-deep)}
.opt[aria-pressed="true"] small{color:var(--pink-deep)}
.fsheet-foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--surface);margin:18px -18px calc(-18px - env(safe-area-inset-bottom,0px));
  padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;border-top:1px solid var(--line)}
.fsheet-foot .btn.primary{flex:1}

/* card grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative;min-width:0}
.card.has{box-shadow:0 0 0 2.5px var(--pink),var(--shadow)}
.own-badge{position:absolute;top:8px;right:8px;z-index:2;background:var(--pink);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;box-shadow:0 2px 6px rgba(232,62,140,.35)}
.thumb{width:100%;aspect-ratio:460/670;border-radius:9px;display:grid;place-items:center;overflow:hidden;border:0;padding:0;
  background:radial-gradient(var(--line) 1.5px,transparent 1.6px) 0 0/14px 14px,var(--bg)}
.card .thumb{margin:8px 8px 0;width:calc(100% - 16px);cursor:pointer}
.thumb{position:relative}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb.has .ph{visibility:hidden}
.thumb,.tthumb,.photo-prev{--w2h:1.4565}
.sg-th{--w2h:1.4565;position:relative}
.photo-prev{position:relative}
.photo-prev img{position:absolute;inset:0}
img.land{inset:auto !important;left:50% !important;top:50% !important;position:absolute;width:calc(var(--w2h)*100%) !important;height:calc(100% / var(--w2h)) !important;
  transform:translate(-50%,-50%) rotate(90deg);object-fit:cover}
.sg-th img{position:absolute;inset:0}
.thumb .ph{display:flex;flex-direction:column;align-items:center;gap:2px}
.thumb .no{font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif;font-size:30px;color:var(--pink-soft);-webkit-text-stroke:1.5px var(--pink);line-height:1.2}
.thumb .cam{font-size:11px;font-weight:800;color:var(--pink);background:var(--surface);border-radius:999px;padding:2px 9px}
.card:not(.showthumb) .thumb{display:none}
.card .face{border:0;background:none;text-align:left;padding:8px 12px 4px;display:block;width:100%;min-width:0}
.num{font-weight:800;font-size:16px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.rar{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;color:#fff;letter-spacing:.03em}
.rar.ER{background:var(--r-er)}.rar.PR{background:var(--r-pr)}.rar.R{background:var(--r-r)}.rar.N{background:var(--r-n)}
.typedot{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px var(--surface)}
.name{font-size:12.5px;color:var(--muted);min-height:2.7em;line-height:1.35;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.name.set{color:var(--ink)}
.ctrl{padding:4px 10px 10px;display:flex;flex-direction:column;gap:7px}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:999px;padding:2px}
.step button{border:0;background:var(--surface);width:34px;height:34px;font-size:20px;font-weight:800;color:var(--pink);border-radius:50%;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.step button:disabled{color:var(--line);box-shadow:none;background:none}
.step output{flex:1;text-align:center;font-weight:800;font-size:16px}
.step output small{font-size:11px;color:var(--muted);margin-left:1px}
.row2{display:flex;gap:6px;align-items:center}
.gstep{flex:1;min-width:0;display:flex;align-items:center;border:2px solid var(--line);border-radius:999px;height:34px}
.gstep.on{border-color:var(--mint);background:var(--mint-soft)}
.gstep button{border:0;background:none;width:28px;height:30px;font-size:17px;font-weight:800;color:var(--mint);flex:none}
.gstep button:disabled{color:var(--line)}
.gstep output{flex:1;text-align:center;font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap}
.gstep.on output{color:var(--mint)}
.row2 .tag{flex:none;width:44px;height:34px}
.tag{border:2px solid var(--line);background:none;border-radius:999px;height:32px;font-weight:800;font-size:14px;color:var(--muted);min-width:0}
.tag.want[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
/* search suggest */
.qclear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--line);color:var(--surface);width:22px;height:22px;border-radius:50%;font-size:14px;line-height:1;font-weight:800}
.qclear[hidden]{display:none}
.sbox input{padding-right:36px}
.sbox input::-webkit-search-cancel-button{display:none}
.suggest{position:absolute;left:0;right:-60px;top:calc(100% + 8px);z-index:20;background:var(--surface);border-radius:18px;box-shadow:0 12px 32px rgba(74,35,87,.18);padding:6px;max-height:60vh;overflow:auto}
.suggest[hidden]{display:none}
.sg-head{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:12px;font-weight:800;color:var(--muted)}
.sg-head button{border:0;background:none;color:var(--pink);font-weight:800;font-size:12px}
.sg-row{display:flex;align-items:center}
.sg-item{flex:1;min-width:0;border:0;background:none;text-align:left;padding:9px 10px;border-radius:12px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.sg-item:active{background:var(--pink-soft)}
.sg-item .ico{font-size:14px;opacity:.7}
.sg-all{color:var(--pink-deep)}
.sg-del{border:0;background:none;color:var(--muted);font-size:16px;width:34px;height:34px}
.sg-th{width:34px;height:49.5px;border-radius:4px;flex:none;overflow:hidden;background:radial-gradient(var(--line) 1px,transparent 1.2px) 0 0/8px 8px,var(--bg)}
.sg-th img{width:100%;height:100%;object-fit:cover}
.sg-tx{min-width:0;display:flex;flex-direction:column}
.sg-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-no{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.sg-none{padding:10px;font-size:13px;color:var(--muted)}
mark{background:linear-gradient(transparent 55%,#FFE066 55%);color:inherit;padding:0}

/* trade tab */
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow);margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px 0;font-weight:800;color:var(--muted)}
.seg button b{font-size:12px;margin-left:2px}
.seg button[data-mode="give"][aria-selected="true"]{background:var(--mint);color:#fff}
.seg button[data-mode="want"][aria-selected="true"]{background:var(--pink);color:#fff}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px 10px}
.titem{min-width:0}
.tthumb{position:relative;aspect-ratio:460/670;border-radius:8px;overflow:hidden;display:grid;place-items:center;box-shadow:var(--shadow);
  background:radial-gradient(var(--line) 1.5px,transparent 1.6px) 0 0/12px 12px,var(--surface)}
.tthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tthumb .no{font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif;font-size:24px;color:var(--pink-soft);-webkit-text-stroke:1.2px var(--pink)}
.tthumb.has .no{display:none}
.tcount{position:absolute;right:6px;bottom:6px;background:var(--mint);color:#fff;font-weight:800;font-size:14px;border-radius:999px;padding:1px 9px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.tname{font-size:12.5px;font-weight:800;margin-top:6px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tno{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-top:1px}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-weight:700}
.addrow{display:flex;justify-content:center;margin-top:18px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(60,20,70,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:88%;overflow:auto;border-radius:26px 26px 0 0;
  padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));position:relative}
.sheet::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:9px;background:var(--line)}
.sheet h2{margin:0 0 10px;font-size:19px;display:flex;align-items:center;gap:8px;font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif;font-weight:400;color:var(--pink-deep)}
label.f{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:12px 0 4px}
.sheet input[type=text],.sheet select,.sheet textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:9px 12px;background:var(--bg)}
.sheet input[type=text]:focus,.sheet select:focus,.sheet textarea:focus{border-color:var(--pink);outline:none}
.sheet textarea{min-height:64px;resize:vertical}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:800;background:var(--bg);color:var(--ink)}
.btn.primary{background:linear-gradient(135deg,var(--pink),#FF8FC4);color:#fff;box-shadow:0 3px 10px rgba(255,92,168,.3)}
.btn.danger{color:#D92D4F}
.btn.small{padding:7px 14px;font-size:13px}
.btn.ghost{background:var(--surface);box-shadow:var(--shadow)}
a.btn{text-decoration:none;display:inline-block}
.photo-prev{width:120px;aspect-ratio:460/670;border-radius:9px;background:var(--bg);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12px;border:2px dashed var(--line)}
.photo-prev img{width:100%;height:100%;object-fit:cover}
.photo-row{display:flex;gap:12px;align-items:flex-end}

/* scan */
.scanbox{background:#2A1433;border-radius:24px;overflow:hidden;aspect-ratio:1/1;max-width:420px;margin:6px auto 0;position:relative;display:grid;place-items:center;box-shadow:var(--shadow)}
.scanbox video{width:100%;height:100%;object-fit:cover}
.scanbox .frame{position:absolute;inset:18%;border:3px dashed rgba(255,143,196,.95);border-radius:22px;pointer-events:none}
.scanbox .idle{color:#fff;opacity:.85;text-align:center;padding:20px;font-size:14px;font-weight:700}
.pop{position:absolute;inset:auto 12px 12px;z-index:3;border-radius:18px;padding:10px 14px;color:#fff;display:flex;flex-direction:column;align-items:center;text-align:center;
  opacity:0;transform:translateY(8px) scale(.96);transition:opacity .12s,transform .12s;pointer-events:none}
.pop.on{opacity:1;transform:none}
.pop.ok{background:rgba(34,184,166,.94)}
.pop.ng{background:rgba(232,62,140,.94)}
.pop b{font-size:20px;line-height:1.2}
.pop span{font-size:12px;font-weight:700;opacity:.95}
.pop em{font-style:normal;font-weight:800;font-size:15px;margin-top:2px}
@media (prefers-reduced-motion:reduce){.pop{transition:none}}
.recent-h{font-size:12px;font-weight:800;color:var(--muted);margin:4px 4px 6px}
.recent{list-style:none;margin:0;padding:0}
.recent li{background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:8px 8px 8px 12px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.rmain{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmain select{width:100%;border:2px solid var(--pink);border-radius:12px;background:var(--bg);padding:6px}
.rmain b{display:block;font-size:13px;line-height:1.2}
.rname{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr{flex:none;display:flex;gap:4px}
.lr button{border:2px solid var(--line);background:none;border-radius:10px;width:38px;height:36px;font-weight:800;font-size:14px;color:var(--muted)}
.lr button[aria-pressed="true"]{background:var(--lav);border-color:var(--lav);color:#fff}
.undo{flex:none;border:0;background:var(--bg);color:var(--pink-deep);font-weight:800;font-size:12px;border-radius:999px;padding:9px 10px}
.sidebar{margin:6px 0 10px;display:flex;flex-direction:column;gap:8px}
.sidepick{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.sidepick button{border:0;background:none;border-radius:999px;padding:10px 12px;font-weight:800;font-size:15px;color:var(--muted)}
.sidepick button{font-size:14px}
.sidepick button[aria-checked="true"]{background:linear-gradient(135deg,var(--lav),#C7B3FF);color:#fff;box-shadow:0 3px 10px rgba(169,139,255,.35)}
.sidepick button[data-smode="off"][aria-checked="true"]{background:var(--bg);color:var(--ink);box-shadow:none}
#placeIn[hidden]{display:none}
.zones{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;pointer-events:none}
.zones[hidden]{display:none}
.zones span{display:flex;align-items:flex-start;justify-content:center;padding-top:12px;color:#fff;font-size:12px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.6);
  border:3px dashed rgba(199,179,255,.9);margin:10px 5px 10px 10px;border-radius:18px}
.zones span+span{margin:10px 10px 10px 5px;border-color:rgba(255,143,196,.9)}
#placeIn{border:2px solid transparent;background:var(--surface);border-radius:999px;padding:9px 16px;box-shadow:var(--shadow);font-size:14px;width:100%}
#placeIn:focus{border-color:var(--lav);outline:none}
.sd{font-style:normal;display:inline-grid;place-items:center;background:var(--lav);color:#fff;border-radius:6px;font-size:11px;font-weight:800;width:20px;height:20px;margin-right:6px;vertical-align:2px}
.pop .sd{background:#fff;color:var(--mint);width:24px;height:24px;font-size:13px;vertical-align:3px}
.hist .sidesel{max-width:52px}
.hseg{margin-top:6px}
.hseg button[aria-selected="true"]{background:linear-gradient(135deg,var(--pink),#FF8FC4);color:#fff}
.ocols>div{min-width:0}
.ogroup{background:var(--surface);box-shadow:var(--shadow);border-radius:20px;padding:12px 12px 6px;margin-bottom:12px}
.ogroup h3{margin:0 0 8px;font-size:15px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ogroup h3 small{font-size:12px;color:var(--muted);font-weight:700}
.ocols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.oh{font-size:12px;font-weight:800;color:var(--lav);margin-bottom:4px}
.oh b{color:var(--ink);margin-left:2px}
.ocol{margin:0;padding:0 0 0 1.6em;font-size:12px}
.ocol li{padding:4px 0;border-bottom:1px dashed var(--line);min-width:0}
.ocol li::marker{color:var(--muted);font-weight:800}
.ono{font-weight:800;margin-right:4px}
.ocol .rar{font-size:9.5px;padding:0 5px}
.onm{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.onone{font-size:12px;color:var(--muted);margin:4px 0 8px}
.scan-actions{display:flex;gap:8px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.result{background:var(--surface);box-shadow:var(--shadow);border-radius:20px;padding:14px;margin-top:8px}
.result .raw{font-size:12px;color:var(--muted);word-break:break-all;margin-top:4px}
.result.flash{animation:flash .6s}
@keyframes flash{from{box-shadow:0 0 0 4px var(--pink)}to{box-shadow:var(--shadow)}}
@media (prefers-reduced-motion:reduce){.result.flash{animation:none}.bar i{transition:none}}

/* history */
.hist-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 2px 10px}
.hist{list-style:none;margin:0;padding:0}
.hist li{background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.hist .t{font-size:12px;color:var(--muted);font-weight:700}
.hist .main{flex:1;min-width:0}
.hist .rawline{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist select{border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:4px 6px;font-size:13px;max-width:130px}
.note{font-size:12px;color:var(--muted);margin-top:14px}
.set-sec{border-top:1px dashed var(--line);padding-top:12px;margin-top:14px}
.set-sec h3{margin:0 0 4px;font-size:15px}
.set-sec p{margin:0 0 8px;font-size:13px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-weight:800;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1><small>AIKATSU! ENCORE</small>カード帳<span class="spark" aria-hidden="true">✦</span></h1>
    <div class="brand-r">
      <div class="progress" aria-label="所持状況"><b id="ownCount">0</b> / <span id="totalCount">0</span> 種<div class="bar"><i id="ownBar"></i></div></div>
      <button class="gear" id="gearBtn" aria-label="設定とバックアップ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </div>
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-tab="list">カード</button>
    <button role="tab" aria-selected="false" data-tab="trade">譲・求</button>
    <button role="tab" aria-selected="false" data-tab="scan">QR</button>
    <button role="tab" aria-selected="false" data-tab="hist">履歴</button>
  </nav>
</header>

<main>
  <!-- LIST -->
  <section class="panel" id="p-list">
    <div class="search">
      <div class="sbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" enterkeyhint="search" placeholder="カード名・番号で検索" autocomplete="off" aria-label="カードを検索" aria-controls="suggest">
        <button class="qclear" id="qClear" aria-label="検索語を消す" hidden>×</button>
        <div class="suggest" id="suggest" hidden></div>
      </div>
      <button class="fbtn" id="filterBtn" aria-label="絞り込み"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>絞り込み<span class="badge" id="fCount" hidden></span></button>
    </div>
    <div class="active" id="activeFilters"></div>
    <div class="row-tools"><span id="hitCount"></span><span id="sortLabel"></span></div>
    <div class="grid" id="grid"></div>
    <div class="addrow"><button class="btn small ghost" id="addCustom">＋ プロモなどカードを追加</button></div>
  </section>

  <!-- TRADE -->
  <section class="panel" id="p-trade" hidden>
    <div class="seg" role="tablist" aria-label="譲・求の切り替え">
      <button data-mode="give" aria-selected="true">譲 <b id="giveN">0</b></button>
      <button data-mode="want" aria-selected="false">求 <b id="wantN">0</b></button>
    </div>
    <div class="tgrid" id="tradeGrid"></div>
  </section>

  <!-- SCAN -->
  <section class="panel" id="p-scan" hidden>
    <div class="sidebar">
      <div class="sidepick" role="radiogroup" aria-label="排出口（左右）の記録">
        <button data-smode="pos" role="radio">左右を記録する</button>
        <button data-smode="off" role="radio">記録しない</button>
      </div>
      <input id="placeIn" type="text" placeholder="店舗・筐体（例: 駅前ゲーセン 1号機）" autocomplete="off" aria-label="店舗・筐体">
    </div>
    <div class="scanbox" id="scanbox">
      <div class="idle" id="scanIdle">カメラを起動して、カード裏の2次元コードをかざしてね</div>
      <video id="video" playsinline muted hidden></video>
      <div class="frame" id="frame" hidden></div>
      <div class="zones" id="zones" hidden><span>◀ 左から出たカード</span><span>右から出たカード ▶</span></div>
      <div class="pop" id="scanPop" aria-live="polite"></div>
    </div>
    <div class="scan-actions">
      <button class="btn primary" id="camBtn">カメラを起動</button>
      <label class="btn">写真から読む<input type="file" accept="image/*" id="qrFile" hidden></label>
    </div>
    <div id="scanResult"></div>
    <p class="note">カードが判別できると自動で所持が＋1されます。同じカードを続けて読むときは、1枚ごとにいったん枠の外に出してね。判別できないコードは、一度カードを選んで紐付けると次回から自動で数えます。</p>
  </section>

  <!-- HISTORY -->
  <section class="panel" id="p-hist" hidden>
    <div class="seg hseg" role="tablist" aria-label="履歴の表示切り替え">
      <button data-hmode="list" aria-selected="true">読み込み履歴</button>
      <button data-hmode="order" aria-selected="false">配列</button>
    </div>
    <div id="orderView" hidden></div>
    <div id="listView">
    <div class="hist-head">
      <strong id="histCount">0 件</strong>
      <span>
        <button class="btn small primary" id="csvBtn">CSVで保存</button>
        <button class="btn small danger" id="clearHist">全消去</button>
      </span>
    </div>
    <ul class="hist" id="hist"></ul>
    </div>
  </section>
</main>

<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>
<canvas id="cv" hidden></canvas>
<input type="file" accept="image/*" id="tilePhoto" hidden>

<script>
(() => {
"use strict";
/* ---------- master: cards.js から読み込み ---------- */
const RAR_ORDER = {ER:0, PR:1, R:2, N:3};
const TYPES = ["キュート","クール","セクシー","ポップ"];
const TYPE_COLOR = {"キュート":"var(--c-cute)","クール":"var(--c-cool)","セクシー":"var(--c-sexy)","ポップ":"var(--c-pop)"};
const MASTER = (window.CARD_MASTER && Array.isArray(window.CARD_MASTER.sets)) ? window.CARD_MASTER : {version:"なし", sets:[]};
const SETS = MASTER.sets.map(s=>({id:String(s.id), name:String(s.name||s.id)}));
const BASE = [];
const BASE_NOS = new Set();
MASTER.sets.forEach(s=>(s.cards||[]).forEach(row=>{
  if (!Array.isArray(row) || !row[0]) return;
  const no = String(row[0]).normalize("NFKC").trim().toUpperCase();
  if (BASE_NOS.has(no)) return;
  const r = RAR_ORDER[String(row[1]).toUpperCase()]!==undefined ? String(row[1]).toUpperCase() : "N";
  BASE.push({no, rar:r, set:String(s.name||s.id), setId:String(s.id), mname:row[2]?String(row[2]):"", cat:row[3]?String(row[3]):"", idol:row[4]?String(row[4]):"", master:true});
  BASE_NOS.add(no);
}));
// 公式カードリストの画像URLは「番号_レアリティ」の規則（E1, E2… の弾のみ）
const officialUrl = c => (c.master && /^E\d+$/.test(c.setId)) ? `https://dcd.aikatsu.com/encore/images/cardlist/card/${c.no}_${c.rar}.webp` : null;

/* ---------- state ---------- */
const LS_KEY = "aikatsu-encore-v1";
let store = {cards:{}, custom:[], qrmap:{}};
let scans = [];
try { const s = JSON.parse(localStorage.getItem(LS_KEY)||"null"); if (s){ store = Object.assign(store, s.store||{}); scans = s.scans||[]; } } catch(e){}
const ui = {q:"", status:"all", rar:"all", type:"all", set:"all", cat:"all", idol:"all", sort:"num", thumbs:true, official:true, tab:"list"};
try { ui.thumbs = localStorage.getItem(LS_KEY+":thumbs")!=="0"; ui.official = localStorage.getItem(LS_KEY+":official")!=="0"; } catch(e){}

// 表示するカード = マスタ ＋ 自分で追加したカード ＋ データだけ残っているカード
// （マスタから番号が消えても、所持データがあるカードは消さずに表示し続ける）
function allCards(){
  const out = BASE.slice(), seen = new Set(BASE_NOS);
  store.custom.forEach(c=>{ if (!seen.has(c.no)){ out.push(Object.assign({setId:"custom"}, c)); seen.add(c.no); } });
  Object.keys(store.cards).forEach(no=>{
    const s = store.cards[no];
    if (!seen.has(no) && s && (s.own>0 || s.want || s.give || s.name || s.memo)){
      out.push({no, rar:"N", set:"その他", setId:"orphan"}); seen.add(no);
    }
  });
  return out;
}
const displayName = c => st(c.no).name || c.mname || "";
// giveCount（譲れる枚数）は所持枚数とは別に管理。旧データの「譲:ON」は読み込み時に1枚として扱う（保存データは書き換えない）
const st = no => {
  const s = store.cards[no];
  const b = Object.assign({own:0, want:false, give:false, giveCount:0, name:"", type:"", memo:""}, s||{});
  if (s && s.giveCount===undefined) b.giveCount = s.give ? 1 : 0;
  return b;
};
function patch(no, p){ store.cards[no] = Object.assign({}, st(no), p); save(); }

/* ---------- カードマスタ更新時の安全策 ---------- */
// マスタの版が変わったら、更新前のデータを丸ごと1世代コピーしておく（データ自体は一切書き換えない）
try{
  const prevVer = localStorage.getItem(LS_KEY+":masterVersion");
  if (prevVer !== MASTER.version){
    const cur = localStorage.getItem(LS_KEY);
    if (prevVer && cur) localStorage.setItem(LS_KEY+":snapshot", JSON.stringify({at:Date.now(), from:prevVer, to:MASTER.version, data:cur}));
    localStorage.setItem(LS_KEY+":masterVersion", MASTER.version);
  }
}catch(e){}

/* ---------- persistence: localStorage ---------- */
let saveFailed = false;
function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify({store, scans})); saveFailed=false; }
  catch(e){ if (!saveFailed){ saveFailed=true; toast("保存できませんでした。容量不足の可能性があります"); } }
}
// ブラウザに「データを消さないで」とお願いする（対応ブラウザのみ）
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* ---------- photos: IndexedDB on this device ---------- */
let idb = null; const photoCache = {};
function openIdb(){ return new Promise(res=>{ try{ const r=indexedDB.open("aikatsu-photos",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("p"); r.onsuccess=()=>{idb=r.result;res();}; r.onerror=()=>res(); }catch(e){res();} }); }
function getPhoto(no){ return new Promise(res=>{ if(!idb) return res(null); if(no in photoCache) return res(photoCache[no]);
  try{ const q=idb.transaction("p").objectStore("p").get(no); q.onsuccess=()=>{photoCache[no]=q.result||null;res(photoCache[no]);}; q.onerror=()=>res(null);}catch(e){res(null);} }); }
function setPhoto(no, data){ photoCache[no]=data; if(!idb) return; try{ const os=idb.transaction("p","readwrite").objectStore("p"); data?os.put(data,no):os.delete(no);}catch(e){} }
async function photoSrc(no){ return await getPhoto(no); }
// 表示用の画像: 自分で登録した写真 → なければ公式サイトの画像を直接読み込む（ファイルとしては保存・同梱しない）
async function imgSrc(no){
  const p = await getPhoto(no); if (p) return {src:p, official:false};
  const c = cardByNo(no), u = c && ui.official ? officialUrl(c) : null;
  return u ? {src:u, official:true} : null;
}
function imgTag(r){ return `<img alt="" src="${esc(r.src)}" loading="lazy" decoding="async"${r.official?' class="oimg"':""}>`; }
// 横長の画像（アクセサリーカードなど）は、公式サイトと同じように縦向きに回転して枠に収める
document.addEventListener("load", e=>{
  const t=e.target; if (t.tagName!=="IMG" || !t.closest(".thumb,.tthumb,.sg-th,.photo-prev")) return;
  t.classList.toggle("land", t.naturalWidth > t.naturalHeight*1.05);
}, true);
// 公式画像が読めなかったとき（オフライン等）は数字のプレースホルダーに戻す
document.addEventListener("error", e=>{
  const t=e.target; if (t.tagName!=="IMG" || !t.classList.contains("oimg")) return;
  const box=t.parentElement; t.remove(); if (box){ box.classList.remove("has"); delete box.dataset.has; }
}, true);
function getAllPhotos(){ return new Promise(res=>{ const out={}; if(!idb) return res(out);
  try{ const r=idb.transaction("p").objectStore("p").openCursor();
    r.onsuccess=()=>{ const c=r.result; if(c){ if(c.value) out[c.key]=c.value; c.continue(); } else res(out); }; r.onerror=()=>res(out);
  }catch(e){ res(out); } }); }
function clearAllPhotos(){ for (const k in photoCache) delete photoCache[k]; if(!idb) return; try{ idb.transaction("p","readwrite").objectStore("p").clear(); }catch(e){} }
function resizeToBlob(file, max=600){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
    c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",.85); };
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("load"));}; img.src=url; }); }
const blobToDataUrl = b => new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); });
let uploading = 0;
async function registerPhoto(no, file){
  uploading++; toast("写真を登録中…");
  try{
    const blob = await resizeToBlob(file);
    setPhoto(no, await blobToDataUrl(blob));
    toast(`${no} の写真を登録しました`); return true;
  }catch(e){ toast("画像を読み込めませんでした"); return false; }
  finally{ uploading--; }
}
function removePhoto(no){
  setPhoto(no,null);
}
function resizeImage(file, max=480){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
    c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",.8)); }; img.onerror=rej; img.src=url; }); }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kana = s => String(s||"").normalize("NFKC").toLowerCase().replace(/[\u30a1-\u30f6]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60));
let toastT; function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1800); }
function fmtTime(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
function cardByNo(no){ return allCards().find(c=>c.no===no); }
function label(c){ const n=displayName(c); return n ? `${c.no} ${n}` : c.no; }

/* ---------- search ---------- */
function matches(c){
  const s = st(c.no);
  if (ui.status==="own" && s.own<1) return false;
  if (ui.status==="missing" && s.own>0) return false;
  if (ui.status==="want" && !s.want) return false;
  if (ui.status==="give" && s.giveCount<1) return false;
  if (ui.status==="dup" && s.own<2) return false;
  if (ui.rar!=="all" && c.rar!==ui.rar) return false;
  if (ui.set!=="all" && c.setId!==ui.set && !(ui.set==="custom" && c.setId==="orphan")) return false;
  if (ui.cat!=="all" && c.cat!==ui.cat) return false;
  if (ui.idol!=="all" && c.idol!==ui.idol) return false;
  if (ui.type!=="all"){ if (ui.type==="none" ? s.type : s.type!==ui.type) return false; }
  return matchesText(c);
}
function matchesText(c){
  const s = st(c.no);
  const q = kana(ui.q).trim();
  if (!q) return true;
  return q.split(/\s+/).every(w=>{
    if (/^\d{1,3}$/.test(w)) return parseInt(c.no.split("-")[1],10)===parseInt(w,10) || c.no.includes(w);
    const hay = kana([c.no, c.rar, s.name, c.mname, c.cat, c.idol, s.memo, s.type, c.set].join(" "));
    const loose = x => x.replace(/[-\s・･]/g,"");
    return hay.includes(w) || loose(hay).includes(loose(w));
  });
}
function sorted(list){
  const byNo = (a,b)=> a.no.localeCompare(b.no, "ja", {numeric:true});
  if (ui.sort==="rar") return list.sort((a,b)=>RAR_ORDER[a.rar]-RAR_ORDER[b.rar] || byNo(a,b));
  if (ui.sort==="own") return list.sort((a,b)=>st(b.no).own-st(a.no).own || byNo(a,b));
  return list.sort(byNo);
}

/* ---------- render: chips ---------- */
const SORTS = [["num","番号順"],["rar","レア順"],["own","所持数順"]];
const FILTER_KEYS = ["status","rar","type","set","cat","idol"];
function filterDefs(){
  const cnt = f => allCards().filter(c=>f(c, st(c.no))).length;
  const extra = allCards().some(c=>c.setId==="custom"||c.setId==="orphan") ? [["custom","自分で追加", cnt(c=>c.setId==="custom"||c.setId==="orphan")]] : [];
  return [
    {key:"status", title:"持っているか", opts:[["all","すべて"],["own","所持",cnt((c,s)=>s.own>0)],["missing","未所持",cnt((c,s)=>s.own<1)],
      ["want","求",cnt((c,s)=>s.want)],["give","譲",cnt((c,s)=>s.giveCount>0)],["dup","ダブり",cnt((c,s)=>s.own>1)]]},
    {key:"rar", title:"レアリティ", opts:[["all","すべて"], ...["ER","PR","R","N"].map(r=>[r,r,cnt(c=>c.rar===r)])]},

function hl(text){
  const words = kana(ui.q).trim().split(/\s+/).filter(w=>w && !/^\d{1,3}$/.test(w));
  const t = String(text); if (!words.length) return esc(t);
  const k = kana(t); const mark = new Array(t.length).fill(false);
  // NFKCで長さが変わらない文字列のときだけ位置を合わせて強調
  if (k.length===t.length) words.forEach(w=>{ let i=k.indexOf(w); while(i>-1){ for(let j=i;j<i+w.length;j++) mark[j]=true; i=k.indexOf(w,i+1);} });
  let out="", open=false;
  for (let i=0;i<t.length;i++){ if(mark[i]&&!open){out+="<mark>";open=true;} if(!mark[i]&&open){out+="</mark>";open=false;} out+=esc(t[i]); }
  return out+(open?"</mark>":"");
}

function beep(ok){
  try{
    if (!audioCtx) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.frequency.value = ok ? 1320 : 520; o.type="sine";
    g.gain.setValueAtTime(.18, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+.12);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.13);
  }catch(e){}
  if (navigator.vibrate) navigator.vibrate(ok?40:[30,40,30]);
}

}
function addOne(entry){
  const s=st(entry.card); patch(entry.card,{own:s.own+1});
  entry.added = true; save();
}
function undoScan(entry){
  if (entry.undone) return;
  if (entry.added && entry.card){
    const s=st(entry.card), own=Math.max(0,s.own-1), g=Math.min(s.giveCount,own);
    patch(entry.card,{own, giveCount:g, give:g>0});
  }
  entry.undone = true;
  const i = scans.indexOf(entry); if (i>-1) scans.splice(i,1);
  save(); renderAll(); renderRecent(); toast(entry.card?`${entry.card} の＋1を取り消しました`:"取り消しました");
}
function onDecoded(raw, fromFile, cx){
  const now = Date.now();
  const side = (sideMode==="pos" && typeof cx==="number") ? (cx<0.5 ? "L" : "R") : "";
  const key = raw+"|"+side;
  if (!fromFile){
    if (now < pauseUntil) return;
    if (presentMap[key] && now-presentMap[key] < GONE_MS){ presentMap[key]=now; return; }
  }
  const card = guessCard(raw);
  const entry = {t:now, raw, card};
  if (side) entry.side = side;
  if (curPlace) entry.place = curPlace;
  scans.push(entry);
  if (card) addOne(entry); else save();
  sessionScans.unshift(entry); if (sessionScans.length>8) sessionScans.pop();
  presentMap[key] = now+POP_MS; pauseUntil = now+POP_MS;
  if (card){ const c=cardByNo(card), n=displayName(c);
    showPop(`<b>${entry.side?`<i class="sd">${SIDE_LABEL[entry.side]}</i>`:""}${esc(card)}</b>${n?`<span>${esc(n)}</span>`:""}<em>＋1　計${st(card).own}枚</em>`, true); beep(true); }
  else { showPop(`<b>未登録のコード</b><span>下でカードを選んでね</span>`, false); beep(false); }
  renderAll(); renderRecent();
}
function cardOptions(sel){
  return `<option value="">（未判別）</option>` + sorted(allCards().slice()).map(c=>`<option value="${esc(c.no)}" ${c.no===sel?"selected":""}>${esc(label(c))}</option>`).join("");
}
function renderRecent(){
  const list = sessionScans.filter(e=>!e.undone);
  $("#scanResult").innerHTML = list.length ? `<div class="recent-h">今回読み込んだカード</div><ul class="recent">` + list.map((e,i)=>{
    const c = e.card && cardByNo(e.card), n = c ? displayName(c) : "";
    return `<li data-ri="${sessionScans.indexOf(e)}">
      <div class="rmain">${c ? `<b>${esc(e.card)}</b><span class="rname">${n?esc(n):""}</span>`
        : `<select data-link aria-label="このコードのカード">${cardOptions("")}</select>`}</div>
      <div class="lr" role="group" aria-label="排出口">
        <button data-lr="L" aria-pressed="${e.side==="L"}">左</button><button data-lr="R" aria-pressed="${e.side==="R"}">右</button>
      </div>
      <button class="undo" data-undo aria-label="取り消し">取消</button></li>`; }).join("") + `</ul>` : "";
}
$("#scanResult").addEventListener("click", e=>{
  const lr=e.target.closest("[data-lr]");
  if (lr){ // 左右をあとから付ける・直す（同じボタンをもう一度押すと解除）
    const entry=sessionScans[+lr.closest("li").dataset.ri];
    if (entry.side===lr.dataset.lr) delete entry.side; else entry.side=lr.dataset.lr;
    save(); renderRecent(); renderHist(); renderOrder(); return;
  }
  const b=e.target.closest("[data-undo]"); if(!b) return;
  undoScan(sessionScans[+b.closest("li").dataset.ri]);
});
$("#scanResult").addEventListener("change", e=>{
  const sel=e.target.closest("[data-link]"); if(!sel || !sel.value) return;
  const entry = sessionScans[+sel.closest("li").dataset.ri];
  linkScan(entry, sel.value); addOne(entry);
  renderAll(); renderRecent(); toast(`${sel.value} に紐付けて＋1しました`);
});
function linkScan(entry, no){
  entry.card = no;
  if (no) store.qrmap[entry.raw]=no; else delete store.qrmap[entry.raw];
  scans.forEach(s=>{ if (s.raw===entry.raw) s.card=no; });
  save(); renderHist();
}
// 見つかったコードを [{raw, cx}] で返す（cx = 横方向の中心位置 0〜1）
async function detectAll(source, w, h, srcW){
  if (detector){ try{ const r = await detector.detect(source);
    if (r.length) return r.map(x=>({raw:x.rawValue, cx:(x.boundingBox.x + x.boundingBox.width/2)/(srcW||w)})); }catch(e){} }
  if (window.jsQR){ cv.width=w; cv.height=h; ctx.drawImage(source,0,0,w,h); const d=ctx.getImageData(0,0,w,h);
    const r=jsQR(d.data,w,h,{inversionAttempts:"attemptBoth"});
    if (r){ const L=r.location; return [{raw:r.data, cx:(L.topLeftCorner.x+L.topRightCorner.x+L.bottomLeftCorner.x+L.bottomRightCorner.x)/4/w}]; } }
  return [];
}
async function detectFrame(source, w, h){ const a = await detectAll(source, w, h); return a.length ? a[0].raw : null; }
async function loop(){
  if (!stream) return;
  if (video.readyState>=2){
    const w=video.videoWidth, h=video.videoHeight, s=Math.min(1, 720/Math.max(w,h));
    const hits = await detectAll(video, Math.round(w*s), Math.round(h*s), w);
    hits.forEach(x=>onDecoded(x.raw, false, x.cx));
  }
  rafId = setTimeout(()=>requestAnimationFrame(loop), 90);
}
async function startCam(){
  try{ if (!audioCtx){ const A=window.AudioContext||window.webkitAudioContext; if (A) audioCtx=new A(); } audioCtx && audioCtx.resume(); }catch(e){}
  if (!navigator.mediaDevices?.getUserMedia){ toast("このブラウザではカメラを使えません。写真から読んでね"); return; }
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}, audio:false});
    video.srcObject=stream; video.hidden=false; $("#scanIdle").hidden=true; renderSidePick();
    await video.play(); $("#camBtn").textContent="カメラを止める"; loop();
  }catch(e){ stream=null; toast("カメラを起動できませんでした。「写真から読む」を使ってね"); }
}
function stopCam(){
  if (stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  clearTimeout(rafId); video.hidden=true; $("#scanIdle").hidden=false; renderSidePick();
  $("#camBtn").textContent="カメラを起動";
}
$("#camBtn").addEventListener("click", ()=> stream ? stopCam() : startCam());
$("#qrFile").addEventListener("change", async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  const img=new Image(); const url=URL.createObjectURL(f);
  img.onload = async ()=>{ const s=Math.min(1,1400/Math.max(img.width,img.height));
    const hits = await detectAll(img, Math.round(img.width*s), Math.round(img.height*s), img.width); URL.revokeObjectURL(url);
    if (hits.length){ hits.forEach(x=>onDecoded(x.raw, true, x.cx)); } else toast("2次元コードが見つかりませんでした"); };
  img.src=url;
});

/* ---------- history ---------- */
function renderHist(){
  $("#histCount").textContent = `${scans.length} 件`;
  const items = scans.map((s,i)=>({s,i})).reverse().slice(0,300);
  $("#hist").innerHTML = items.length ? items.map(({s,i})=>`<li>
      <div class="main"><div class="t">${fmtTime(s.t)}${s.place?`　${esc(s.place)}`:""}</div><div class="rawline">${esc(s.raw)}</div></div>
      <select data-side-i="${i}" class="sidesel" aria-label="排出口"><option value="">−</option><option value="L" ${s.side==="L"?"selected":""}>左</option><option value="R" ${s.side==="R"?"selected":""}>右</option></select>
      <select data-i="${i}" aria-label="カード">${cardOptions(s.card)}</select>
    </li>`).join("") : `<li style="justify-content:center;color:var(--muted)">まだ読み込み履歴はありません。QR読み込みタブから始めよう</li>`;
}
$("#hist").addEventListener("change", e=>{
  const ss=e.target.closest("select[data-side-i]");
  if (ss){ const s=scans[+ss.dataset.sideI]; if (ss.value) s.side=ss.value; else delete s.side; save(); renderOrder(); return; }
  const sel=e.target.closest("select[data-i]"); if(!sel) return; linkScan(scans[+sel.dataset.i], sel.value); renderOrder();
});
/* ---------- 配列（排出口ごとの排出順） ---------- */
let histMode = "list";
document.querySelectorAll("[data-hmode]").forEach(b=>b.addEventListener("click",()=>{
  histMode=b.dataset.hmode;
  document.querySelectorAll("[data-hmode]").forEach(x=>x.setAttribute("aria-selected", x===b));
  $("#listView").hidden = histMode!=="list"; $("#orderView").hidden = histMode!=="order";
  if (histMode==="order") renderOrder();
}));
function dayKey(t){ const d=new Date(t), p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}`; }
function renderOrder(){
  const el=$("#orderView"); if (!el) return;
  const withSide = scans.filter(s=>s.side);
  if (!withSide.length){ el.innerHTML = `<div class="empty">まだ配列の記録はありません。<br>QRタブで「左」か「右」を選んでから読み込むと、ここに排出順で並びます</div>`; return; }
  const groups = new Map();
  withSide.forEach(s=>{ const k=dayKey(s.t)+"\u0000"+(s.place||""); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(s); });
  const keys=[...groups.keys()].sort((a,b)=>groups.get(b)[0].t-groups.get(a)[0].t);
  const col = (list)=> list.length ? `<ol class="ocol">${list.map(s=>{ const c=s.card&&cardByNo(s.card), n=c?displayName(c):"";
      return `<li><span class="ono">${c?esc(c.no):"未判別"}</span>${c?`<span class="rar ${c.rar}">${c.rar}</span>`:""}<span class="onm">${esc(n)}</span></li>`; }).join("")}</ol>` : `<p class="onone">記録なし</p>`;
  el.innerHTML = keys.map(k=>{ const [day,place]=k.split("\u0000"), list=groups.get(k).slice().sort((a,b)=>a.t-b.t);
    const L=list.filter(s=>s.side==="L"), R=list.filter(s=>s.side==="R");
    return `<section class="ogroup"><h3>${esc(day)}${place?`<small>${esc(place)}</small>`:""}</h3>
      <div class="ocols"><div><div class="oh">◀ 左 <b>${L.length}</b></div>${col(L)}</div><div><div class="oh">右 ▶ <b>${R.length}</b></div>${col(R)}</div></div></section>`; }).join("");
}
$("#clearHist").addEventListener("click", ()=>{ if(!scans.length) return; if(!confirm("読み込み履歴をすべて消去しますか？")) return; scans=[]; save(); renderHist(); toast("履歴を消去しました"); });

function csvCell(v){ v=String(v??""); return /[",\r\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; }
$("#csvBtn").addEventListener("click", async ()=>{
  if (!scans.length){ toast("履歴がまだありません"); return; }
  const rows = [["読み込み日時","排出口","店舗・筐体","カード番号","レアリティ","カード名","所持枚数","譲れる枚数","QR内容"]];
  scans.forEach(s=>{ const c=s.card&&cardByNo(s.card); const x=c?st(c.no):{};
    rows.push([fmtTime(s.t), s.side?SIDE_LABEL[s.side]:"", s.place||"", s.card||"", c?c.rar:"", c?displayName(c):"", c?x.own:"", c?x.giveCount:"", s.raw]); });
  const csv = "\uFEFF" + rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  const filename = `aikatsu_qr_history_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.csv`;
  await downloadFile(filename, csv, "text/csv");
});

/* ---------- file download ---------- */
async function downloadFile(filename, text, type){
  const blob = new Blob([text], {type});
  // iPhone/iPad は共有シートから「ファイルに保存」できるようにする
  if (/iPhone|iPad|iPod/.test(navigator.userAgent) && navigator.canShare){
    try{
      const file = new File([blob], filename, {type});
      if (navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return true; }
    }catch(e){ if (e.name==="AbortError") return false; }
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast(`${filename} を保存しました`); return true;
}

/* ---------- settings: backup / restore ---------- */
const APP_VERSION = "2026-10-04 r12";
const BACKUP_KIND = "aikatsu-encore-cardbook";
function stamp(){ const d=new Date(), p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }
function snapInfo(){
  try{ const sn=JSON.parse(localStorage.getItem(LS_KEY+":snapshot")||"null");
    if (!sn) return "";
    return `<p>前回のカードデータ更新（${esc(sn.from)} → ${esc(sn.to)}）の直前の状態を保存しています。</p><button class="btn small" id="snapRestore">更新前の状態に戻す</button>`;
  }catch(e){ return ""; } }
function lastBackupText(){ try{ const t=+localStorage.getItem(LS_KEY+":lastBackup"); return t?fmtTime(t):"まだありません"; }catch(e){ return "不明"; } }

$("#gearBtn").addEventListener("click", ()=>{
  const owned = allCards().filter(c=>st(c.no).own>0).length;
  openSheet(`<h2>設定とバックアップ</h2>
    <p class="note" style="margin-top:0">データはこのブラウザの中だけに保存されています。機種変更やブラウザのデータ削除で消えるので、ときどきバックアップしてね。</p>
    <div class="set-sec">
      <h3>バックアップ</h3>
      <p>所持 ${owned} 種・履歴 ${scans.length} 件。前回のバックアップ：${lastBackupText()}</p>
      <label class="chk"><input type="checkbox" id="bkPhotos"> 写真も含める（ファイルが大きくなります）</label>
      <button class="btn primary small" id="bkSave">バックアップを保存</button>
    </div>
    <div class="set-sec">
      <h3>復元</h3>
      <p>バックアップファイルを読み込みます。今のデータは置き換わります。</p>
      <label class="btn small">ファイルを選んで復元<input type="file" accept=".json,application/json" id="bkLoad" hidden></label>
    </div>
    <div class="set-sec">
      <h3>カードデータ</h3>
      <p>${esc(MASTER.version)}版（${BASE.length}種）。新しいカードが追加されても、所持数・求譲・名前・メモ・写真は変わりません。</p>
      ${snapInfo()}
    </div>
    <div class="set-sec">
      <h3>ホーム画面に追加</h3>
      <p>iPhone：Safariの共有ボタン →「ホーム画面に追加」。Android：Chromeのメニュー →「ホーム画面に追加」。追加するとオフラインでも開けます。</p>
    </div>
    <div class="set-sec">
      <h3>リセット</h3>
      <p>所持数・求譲・名前・履歴・写真をすべて消去します。</p>
      <button class="btn small danger" id="bkReset">すべてのデータを消去</button>
    </div>
    <p class="note">アプリの版：${APP_VERSION}</p>
    <div class="btns"><button class="btn" id="bkClose">閉じる</button></div>`);
  $("#bkClose").onclick = closeSheet;
  const sr=$("#snapRestore"); if (sr) sr.onclick = ()=>{
    let sn; try{ sn=JSON.parse(localStorage.getItem(LS_KEY+":snapshot")); }catch(e){}
    if (!sn){ toast("戻せるデータがありません"); return; }
    if (!confirm(`カードデータ更新前（${fmtTime(sn.at)}）の状態に戻しますか？ 写真はそのままです。`)) return;
    try{ const d=JSON.parse(sn.data); store=Object.assign({cards:{},custom:[],qrmap:{}}, d.store||{}); scans=d.scans||[]; save(); closeSheet(); renderAll(); toast("更新前の状態に戻しました"); }
    catch(e){ toast("戻せませんでした"); }
  };
  $("#bkSave").onclick = async ()=>{
    const data = {kind:BACKUP_KIND, version:1, exportedAt:new Date().toISOString(), store, scans};
    if ($("#bkPhotos").checked) data.photos = await getAllPhotos();
    if (await downloadFile(`aikatsu_backup_${stamp()}.json`, JSON.stringify(data), "application/json")){
      try{ localStorage.setItem(LS_KEY+":lastBackup", Date.now()); }catch(e){}
    }
  };
  $("#bkLoad").onchange = e=>{
    const f=e.target.files[0]; e.target.value=""; if(!f) return;
    const r=new FileReader();
    r.onload = ()=>{
      let d; try{ d=JSON.parse(r.result); }catch(_){ toast("JSONとして読み込めませんでした"); return; }
      if (!d || d.kind!==BACKUP_KIND || !d.store){ toast("このアプリのバックアップファイルではありません"); return; }
      const n = Object.values(d.store.cards||{}).filter(x=>x&&x.own>0).length;
      if (!confirm(`${(d.exportedAt||"").slice(0,10)} のバックアップ（所持 ${n} 種・履歴 ${(d.scans||[]).length} 件）で今のデータを置き換えますか？`)) return;
      store = {cards:Object.assign({}, d.store.cards||{}), custom:Array.isArray(d.store.custom)?d.store.custom:[], qrmap:Object.assign({}, d.store.qrmap||{})};
      scans = Array.isArray(d.scans)?d.scans:[];
      if (d.photos && typeof d.photos==="object"){ clearAllPhotos(); for (const k in d.photos) if (typeof d.photos[k]==="string" && d.photos[k].startsWith("data:image/")) setPhoto(k, d.photos[k]); }
      save(); closeSheet(); renderAll(); toast("復元しました");
    };
    r.readAsText(f);
  };
  $("#bkReset").onclick = ()=>{
    if (!confirm("すべてのデータを消去します。元に戻せません。よろしいですか？")) return;
    store={cards:{}, custom:[], qrmap:{}}; scans=[]; clearAllPhotos(); save(); closeSheet(); renderAll(); toast("消去しました");
  };
});

/* ---------- boot ---------- */
renderAll();
openIdb().then(()=>renderGrid());
if ("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
})();
